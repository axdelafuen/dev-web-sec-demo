<div class="container">
  <div class="demo-layout">
    <!-- Left Panel: Login Form -->
    <div class="login-panel">
      <div class="header">
        <button class="back-btn" (click)="goBack()">← Back</button>
        <h2>Secure Version</h2>
        <div class="security-badge">Secure</div>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required
            [disabled]="isLoading"
            (blur)="checkLockoutStatus()"
            placeholder="Enter username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required
            [disabled]="isLoading"
            placeholder="Min 8 chars, upper/lower/digit/special"
          >
        </div>

        <div *ngIf="isLocked" class="alert alert-warning">
          Account locked for {{ lockoutMinutes }} minute(s)
        </div>

        <div *ngIf="!isLocked && remainingAttempts < 5" class="alert alert-info">
          {{ remainingAttempts }} attempt(s) remaining
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>

        <div class="button-group">
          <button 
            type="submit" 
            [disabled]="isLoading || !loginForm.valid || isLocked"
            class="btn btn-primary"
          >
            {{ isLoading ? 'Loading...' : 'Login' }}
          </button>

          <button 
            type="button"
            (click)="bruteForce()"
            [disabled]="isLoading || !username || isLocked || passwords.length === 0"
            class="btn btn-warning"
          >
            Test Brute Force
          </button>

          <button 
            type="button"
            (click)="showPasswordsInfo()"
            class="btn btn-info"
          >
            Show Passwords ({{ passwords.length }})
          </button>
        </div>
      </form>

      <div class="register-section">
        <h3>Register New Account</h3>
        <form (ngSubmit)="onRegister()" #registerForm="ngForm">
          <div class="form-group">
            <input 
              type="text" 
              name="regUsername" 
              [(ngModel)]="regUsername" 
              required
              [disabled]="isRegisterLoading"
              placeholder="Username"
            >
          </div>

          <div class="form-group">
            <input 
              type="password" 
              name="regPassword" 
              [(ngModel)]="regPassword" 
              required
              [disabled]="isRegisterLoading"
              placeholder="Min 8 chars, upper/lower/digit/special"
            >
          </div>

          <div *ngIf="registerError" class="alert alert-error">
            {{ registerError }}
          </div>

          <div *ngIf="registerSuccess" class="alert alert-success">
            {{ registerSuccess }}
          </div>

          <button 
            type="submit" 
            [disabled]="isRegisterLoading || !registerForm.valid"
            class="btn btn-secondary"
          >
            {{ isRegisterLoading ? 'Creating...' : 'Register' }}
          </button>
        </form>
      </div>
    </div>

    <!-- Right Panel: Activity Logs -->
    <div class="logs-panel">
      <div class="logs-header">
        <h3>Activity Logs</h3>
        <button class="btn-clear" (click)="clearLogs()">Clear</button>
      </div>
      
      <div class="logs-container">
        <div *ngFor="let log of logs" class="log-entry" 
             [class.log-info]="log.type === 'info'" 
             [class.log-success]="log.type === 'success'" 
             [class.log-error]="log.type === 'error'">
          {{ log.message }}
        </div>
        <div *ngIf="logs.length === 0" class="log-empty">
          No activity yet
        </div>
      </div>
    </div>
  </div>
</div>
