<div class="container">
  <div class="demo-layout">
    <!-- Left Panel: Login Form -->
    <div class="login-panel">
      <div class="header">
        <button class="back-btn" (click)="goBack()">← Back</button>
        <br>
        <div class="security-badge">Secure</div>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required
            [disabled]="isLoading"
            placeholder="Enter username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required
            [disabled]="isLoading"
            placeholder="Min 8 chars, upper/lower/digit/special"
          >
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>

        <div class="button-group">
          <button 
            type="submit" 
            [disabled]="isLoading || !loginForm.valid"
            class="btn btn-primary"
          >
            {{ isLoading ? 'Loading...' : 'Login' }}
          </button>

          <button 
            type="button"
            (click)="bruteForce()"
            [disabled]="isLoading || !username || isLocked || passwords.length === 0"
            class="btn btn-warning"
          >
            Test Brute Force
          </button>

          <button 
            type="button"
            (click)="showPasswordsInfo()"
            class="btn btn-info"
          >
            Show Passwords ({{ passwords.length }})
          </button>
        </div>
      </form>

      <div class="register-section">
        <h3>Register New Account</h3>
        <form (ngSubmit)="onRegister()" #registerForm="ngForm">
          <div class="form-group">
            <input 
              type="text" 
              name="regUsername" 
              [(ngModel)]="regUsername" 
              required
              [disabled]="isRegisterLoading"
              placeholder="Username"
            >
          </div>

          <div class="form-group">
            <input 
              type="password" 
              name="regPassword" 
              [(ngModel)]="regPassword" 
              required
              [disabled]="isRegisterLoading"
              placeholder="Min 8 chars, upper/lower/digit/special"
            >
          </div>

          <div *ngIf="registerError" class="alert alert-error">
            {{ registerError }}
          </div>

          <div *ngIf="registerSuccess" class="alert alert-success">
            {{ registerSuccess }}
          </div>

          <button 
            type="submit" 
            [disabled]="isRegisterLoading || !registerForm.valid"
            class="btn btn-secondary"
          >
            {{ isRegisterLoading ? 'Creating...' : 'Register' }}
          </button>
        </form>
      </div>
    </div>

    <!-- Logs Panels -->
    <div class="logs-panels">
      <!-- Info Logs -->
      <div class="logs-panel logs-panel-info">
        <div class="logs-header">
          <h3>Info</h3>
          <button class="btn-clear" (click)="clearLogs('info')">Clear</button>
        </div>
        
        <div class="logs-container">
          <div *ngFor="let log of getLogsByType('info')" class="log-entry log-info">
            {{ log.message }}
          </div>
          <div *ngIf="getLogsByType('info').length === 0" class="log-empty">
            No info yet
          </div>
        </div>
      </div>

      <!-- Success Logs -->
      <div class="logs-panel logs-panel-success">
        <div class="logs-header">
          <h3>Success</h3>
          <button class="btn-clear" (click)="clearLogs('success')">Clear</button>
        </div>
        
        <div class="logs-container">
          <div *ngFor="let log of getLogsByType('success')" class="log-entry log-success">
            {{ log.message }}
          </div>
          <div *ngIf="getLogsByType('success').length === 0" class="log-empty">
            No success yet
          </div>
        </div>
      </div>

      <!-- Error Logs -->
      <div class="logs-panel logs-panel-error">
        <div class="logs-header">
          <h3>Errors</h3>
          <button class="btn-clear" (click)="clearLogs('error')">Clear</button>
        </div>
        
        <div class="logs-container">
          <div *ngFor="let log of getLogsByType('error')" class="log-entry log-error">
            {{ log.message }}
          </div>
          <div *ngIf="getLogsByType('error').length === 0" class="log-empty">
            No errors yet
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
